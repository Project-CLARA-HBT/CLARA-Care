server {
    listen 80;
    listen [::]:80;
    server_name theclaracare.com www.theclaracare.com clara.thiennn.icu www.clara.thiennn.icu;
    return 301 https://theclaracare.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clara.thiennn.icu www.clara.thiennn.icu;

    ssl_certificate /etc/letsencrypt/live/clara.thiennn.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clara.thiennn.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://theclaracare.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.theclaracare.com;

    ssl_certificate /etc/letsencrypt/live/theclaracare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theclaracare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://theclaracare.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name theclaracare.com;

    ssl_certificate /etc/letsencrypt/live/theclaracare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theclaracare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/theclaracare.com.access.log;
    error_log /var/log/nginx/theclaracare.com.error.log;

    client_max_body_size 20m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8100;
    }

    location /ml/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:8110/;
    }

    location ^~ /grafana {
        return 410;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:3100;
    }
}
