name: clara-app

services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-false}
      DATABASE_FALLBACK_URL: ${DATABASE_FALLBACK_URL:-sqlite+pysqlite:////data/clara.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_CSRF_ENABLED: ${AUTH_CSRF_ENABLED:-true}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-clara_csrf_token}
      AUTH_BOOTSTRAP_ADMIN_ENABLED: ${AUTH_BOOTSTRAP_ADMIN_ENABLED:-false}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-Clara#Admin2026!}
      AUTH_BOOTSTRAP_ADMIN_FORCE_RESET_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_FORCE_RESET_PASSWORD:-true}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      AUTH_LOGIN_OTP_ENABLED: ${AUTH_LOGIN_OTP_ENABLED:-false}
      AUTH_LOGIN_OTP_ROLES: ${AUTH_LOGIN_OTP_ROLES:-doctor,admin}
      AUTH_LOGIN_OTP_TTL_MINUTES: ${AUTH_LOGIN_OTP_TTL_MINUTES:-5}
      AUTH_AUTO_PROVISION_USERS: ${AUTH_AUTO_PROVISION_USERS:-false}
      MEDICAL_DISCLAIMER_VERSION: ${MEDICAL_DISCLAIMER_VERSION:-2026-04-v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://theclaracare.com}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-CSRF-Token}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      GLOBAL_RATE_LIMIT_PER_MIN: ${GLOBAL_RATE_LIMIT_PER_MIN:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECURITY_REDIS_KEY_PREFIX: ${SECURITY_REDIS_KEY_PREFIX:-clara:sec}
      RATE_LIMIT_DISTRIBUTED_ENABLED: ${RATE_LIMIT_DISTRIBUTED_ENABLED:-false}
      AUTH_LOGIN_DISTRIBUTED_ENABLED: ${AUTH_LOGIN_DISTRIBUTED_ENABLED:-false}
      PUBMED_RATE_LIMIT_PER_SEC: ${PUBMED_RATE_LIMIT_PER_SEC:-10}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8010}
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
      # Must match ML before the explicit DrugBank-identity clarification flow
      # is enabled. Default off leaves the legacy cabinet payload unchanged.
      CAREGUARD_MEDICATION_CLARIFICATION_ENABLED: ${CAREGUARD_MEDICATION_CLARIFICATION_ENABLED:-false}
      # Must not be lower than the governed DeepSeek V4 synthesis deadline.
      ML_SERVICE_TIMEOUT_SECONDS: ${ML_SERVICE_TIMEOUT_SECONDS:-60}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      # The API proxy must outlive the ML ASR decode budget.  Keep this at or
      # above SCRIBE_ASR_TIMEOUT_SECONDS (150s by default) so a healthy Scribe
      # transcription is not cancelled by the gateway before ML can respond.
      ML_SCRIBE_TIMEOUT_SECONDS: ${ML_SCRIBE_TIMEOUT_SECONDS:-180}
      ML_RESEARCH_TIMEOUT_SECONDS: ${ML_RESEARCH_TIMEOUT_SECONDS:-300}
      RESEARCH_JOB_MAX_WORKERS: ${RESEARCH_JOB_MAX_WORKERS:-8}
      UPLOAD_MALWARE_SCAN_REQUIRED: ${UPLOAD_MALWARE_SCAN_REQUIRED:-false}
      UPLOAD_MALWARE_CLAMAV_HOST: ${UPLOAD_MALWARE_CLAMAV_HOST:-}
      UPLOAD_MALWARE_CLAMAV_PORT: ${UPLOAD_MALWARE_CLAMAV_PORT:-3310}
      RESEARCH_ROLE_GATED_TELEMETRY_ENABLED: ${RESEARCH_ROLE_GATED_TELEMETRY_ENABLED:-true}
      RESEARCH_EXPORT_ENABLED: ${RESEARCH_EXPORT_ENABLED:-true}
      RESEARCH_SHARE_ENABLED: ${RESEARCH_SHARE_ENABLED:-true}
      RESEARCH_QUALITY_GATE_ENABLED: ${RESEARCH_QUALITY_GATE_ENABLED:-true}
      LIFEMAP_EVIDENCE_MONITOR_ENABLED: ${LIFEMAP_EVIDENCE_MONITOR_ENABLED:-false}
      LIFEMAP_ASK_AI_ENABLED: ${LIFEMAP_ASK_AI_ENABLED:-false}
      LIFEMAP_ASK_SEMANTIC_ROUTING_ENABLED: ${LIFEMAP_ASK_SEMANTIC_ROUTING_ENABLED:-true}
      LIFEMAP_AI_SUMMARIES_ENABLED: ${LIFEMAP_AI_SUMMARIES_ENABLED:-false}
      LIFEMAP_VIETNAMESE_DRAFTS_ENABLED: ${LIFEMAP_VIETNAMESE_DRAFTS_ENABLED:-false}
      LIFEMAP_CAPTURE_ENABLED: ${LIFEMAP_CAPTURE_ENABLED:-false}
      LIFEMAP_CAPTURE_OBJECT_STORE_URL: ${LIFEMAP_CAPTURE_OBJECT_STORE_URL:-}
      LIFEMAP_CAPTURE_ENCRYPTION_KEY: ${LIFEMAP_CAPTURE_ENCRYPTION_KEY:-}
      LIFEMAP_CAPTURE_CLAMAV_HOST: ${LIFEMAP_CAPTURE_CLAMAV_HOST:-}
      LIFEMAP_CAPTURE_CLAMAV_PORT: ${LIFEMAP_CAPTURE_CLAMAV_PORT:-3310}
      LIFEMAP_CAPTURE_MAX_ARTIFACT_BYTES: ${LIFEMAP_CAPTURE_MAX_ARTIFACT_BYTES:-10000000}
      LIFEMAP_TEXT_DRAFT_EXTRACTION_ENABLED: ${LIFEMAP_TEXT_DRAFT_EXTRACTION_ENABLED:-false}
      COUNCIL_STREAMING_ENABLED: ${COUNCIL_STREAMING_ENABLED:-false}
      COUNCIL_RUN_HISTORY_ENABLED: ${COUNCIL_RUN_HISTORY_ENABLED:-false}
      COUNCIL_OVERSIGHT_ENABLED: ${COUNCIL_OVERSIGHT_ENABLED:-false}
      COUNCIL_RESILIENCE_ENABLED: ${COUNCIL_RESILIENCE_ENABLED:-false}
      COUNCIL_MODEL_DISCLOSURE_ENABLED: ${COUNCIL_MODEL_DISCLOSURE_ENABLED:-false}
      COUNCIL_OBSERVABILITY_ENABLED: ${COUNCIL_OBSERVABILITY_ENABLED:-false}
      COUNCIL_MOBILE_PARITY_ENABLED: ${COUNCIL_MOBILE_PARITY_ENABLED:-false}
      # The Scribe rollout script updates .env.  Keep every API-side stage
      # switch explicit here because deploy compose uses --env-file only for
      # substitution, not automatic container environment injection.
      RAG_SCRIBE_STREAMING_ENABLED: ${RAG_SCRIBE_STREAMING_ENABLED:-false}
      RAG_SCRIBE_DIARIZATION_ENABLED: ${RAG_SCRIBE_DIARIZATION_ENABLED:-false}
      RAG_SCRIBE_CONSENT_REQUIRED: ${RAG_SCRIBE_CONSENT_REQUIRED:-false}
      RAG_SCRIBE_TEMPLATES_ENABLED: ${RAG_SCRIBE_TEMPLATES_ENABLED:-false}
      RAG_SCRIBE_CODING_ENABLED: ${RAG_SCRIBE_CODING_ENABLED:-false}
      RAG_SCRIBE_SIGN_WORKFLOW_ENABLED: ${RAG_SCRIBE_SIGN_WORKFLOW_ENABLED:-false}
      RAG_SCRIBE_EXPORT_ENABLED: ${RAG_SCRIBE_EXPORT_ENABLED:-false}
      RAG_SCRIBE_RECORDING_DATA_DELETION_ENABLED: ${RAG_SCRIBE_RECORDING_DATA_DELETION_ENABLED:-false}
      SCRIBE_TRANSCRIPT_RETENTION_DAYS: ${SCRIBE_TRANSCRIPT_RETENTION_DAYS:-0}
      SCRIBE_AUDIO_MAGIC_VALIDATION_ENABLED: ${SCRIBE_AUDIO_MAGIC_VALIDATION_ENABLED:-false}
      RAG_SCRIBE_FHIR_EXPORT_ENABLED: ${RAG_SCRIBE_FHIR_EXPORT_ENABLED:-false}
      RAG_SCRIBE_GROUNDING_ENABLED: ${RAG_SCRIBE_GROUNDING_ENABLED:-false}
      RAG_SCRIBE_STRUCTURED_EXTRACTION_ENABLED: ${RAG_SCRIBE_STRUCTURED_EXTRACTION_ENABLED:-false}
      RAG_SCRIBE_EM_CPT_CODING_ENABLED: ${RAG_SCRIBE_EM_CPT_CODING_ENABLED:-false}
      RAG_SCRIBE_QUALITY_METRICS_ENABLED: ${RAG_SCRIBE_QUALITY_METRICS_ENABLED:-false}
      RAG_SCRIBE_WER_REPORTING_ENABLED: ${RAG_SCRIBE_WER_REPORTING_ENABLED:-false}
      RAG_SCRIBE_FHIR_COMPOSITION_ENABLED: ${RAG_SCRIBE_FHIR_COMPOSITION_ENABLED:-false}
      RAG_SCRIBE_ADDENDUM_ENABLED: ${RAG_SCRIBE_ADDENDUM_ENABLED:-false}
      RAG_SCRIBE_SPECIALTY_TEMPLATES_ENABLED: ${RAG_SCRIBE_SPECIALTY_TEMPLATES_ENABLED:-false}
      RAG_SCRIBE_EVAL_GATE_ENABLED: ${RAG_SCRIBE_EVAL_GATE_ENABLED:-false}
      SCRIBE_ASR_PRIMARY: ${SCRIBE_ASR_PRIMARY:-whisper}
      SCRIBE_ASR_FALLBACK: ${SCRIBE_ASR_FALLBACK:-whisper}
      SCRIBE_ASR_LANGUAGE: ${SCRIBE_ASR_LANGUAGE:-vi}
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:-}
      DEEPSEEK_STRICT_MODE: ${DEEPSEEK_STRICT_MODE:-false}
      TGC_OCR_BASE_URL: ${TGC_OCR_BASE_URL:-http://host.docker.internal:8080}
      TGC_OCR_ENDPOINTS: ${TGC_OCR_ENDPOINTS:-/api/ocr,/api/extract,/ocr}
      TGC_OCR_TIMEOUT_SECONDS: ${TGC_OCR_TIMEOUT_SECONDS:-45}
      TGC_OCR_API_KEY: ${TGC_OCR_API_KEY:-}
      API_UVICORN_WORKERS: ${API_UVICORN_WORKERS:-4}
      # Database connection-pool sizing (Requirement 10.2). Defaults match the
      # in-code defaults so behavior is unchanged unless explicitly overridden;
      # size relative to API_UVICORN_WORKERS for production load. pool_pre_ping
      # is preserved as the liveness check.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
    ports:
      - "127.0.0.1:${APP_API_PORT:-8100}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - clara_api_data:/data
    networks:
      - default
      - clara_local
    # Container healthcheck (Requirement 6.4). Uses the static /health liveness
    # endpoint (unchanged shape) via the in-image python interpreter, since the
    # slim base image ships no curl/wget. Additive: orchestration liveness only.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  lifemap-worker:
    image: ${API_IMAGE}
    command: ["python", "-m", "clara_api.lifemap.worker"]
    restart: unless-stopped
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-false}
      DATABASE_FALLBACK_URL: ${DATABASE_FALLBACK_URL:-sqlite+pysqlite:////data/clara.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      LIFEMAP_OUTBOX_RELAY_INTERVAL_SECONDS: ${LIFEMAP_OUTBOX_RELAY_INTERVAL_SECONDS:-5}
      LIFEMAP_OUTBOX_RELAY_BATCH_SIZE: ${LIFEMAP_OUTBOX_RELAY_BATCH_SIZE:-100}
      LIFEMAP_OUTBOX_LEASE_SECONDS: ${LIFEMAP_OUTBOX_LEASE_SECONDS:-60}
      LIFEMAP_OUTBOX_BACKOFF_SECONDS: ${LIFEMAP_OUTBOX_BACKOFF_SECONDS:-1}
      LIFEMAP_WORKER_HEALTH_PORT: ${LIFEMAP_WORKER_HEALTH_PORT:-8020}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - clara_api_data:/data
    networks:
      - default
      - clara_local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('LIFEMAP_WORKER_HEALTH_PORT','8020')+'/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s

  evidence-monitor:
    image: ${API_IMAGE}
    command: ["python", "-m", "clara_api.lifemap.evidence_worker"]
    restart: unless-stopped
    environment:
      ENV: ${ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_FALLBACK_ENABLED: ${DATABASE_FALLBACK_ENABLED:-false}
      DATABASE_FALLBACK_URL: ${DATABASE_FALLBACK_URL:-sqlite+pysqlite:////data/clara.db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8010}
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
      ML_RESEARCH_TIMEOUT_SECONDS: ${ML_RESEARCH_TIMEOUT_SECONDS:-300}
      DEEPSEEK_STRICT_MODE: ${DEEPSEEK_STRICT_MODE:-false}
      LIFEMAP_EVIDENCE_MONITOR_ENABLED: ${LIFEMAP_EVIDENCE_MONITOR_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy
      ml:
        condition: service_started
    volumes:
      - clara_api_data:/data
    networks:
      - default
      - clara_local

  ml:
    image: ${ML_IMAGE}
    restart: unless-stopped
    environment:
      ENV: ${ENV:-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.yescale.vip/v1}
      DEEPSEEK_AUDIO_BASE_URL: ${DEEPSEEK_AUDIO_BASE_URL_DOCKER:-http://asr:8090/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_PRO_MODEL: ${DEEPSEEK_PRO_MODEL:-deepseek-v4-pro}
      DEEPSEEK_FLASH_MODEL: ${DEEPSEEK_FLASH_MODEL:-deepseek-v4-flash}
      DEEPSEEK_AUDIO_MODEL: ${DEEPSEEK_AUDIO_MODEL:-whisper-1}
      DEEPSEEK_FALLBACK_MODEL: ${DEEPSEEK_FALLBACK_MODEL:-deepseek-v4-flash}
      MODEL_REGISTRY_ENABLED: ${MODEL_REGISTRY_ENABLED:-true}
      MODEL_REGISTRY_TASK_MODEL_ROUTING_ENABLED: ${MODEL_REGISTRY_TASK_MODEL_ROUTING_ENABLED:-true}
      MODEL_ROUTING_OBSERVABILITY_ENABLED: ${MODEL_ROUTING_OBSERVABILITY_ENABLED:-false}
      MODEL_REGISTRY_FORCE_ROLLBACK: ${MODEL_REGISTRY_FORCE_ROLLBACK:-false}
      MODEL_REGISTRY_ROLLBACK_MODEL: ${MODEL_REGISTRY_ROLLBACK_MODEL:-}
      LIFEMAP_TEXT_DRAFT_EXTRACTION_ENABLED: ${LIFEMAP_TEXT_DRAFT_EXTRACTION_ENABLED:-false}
      CLINICAL_LANGUAGE_LLM_EXTRACTION_ENABLED: ${CLINICAL_LANGUAGE_LLM_EXTRACTION_ENABLED:-false}
      CAREGUARD_CLINICAL_SPAN_AUGMENTATION_ENABLED: ${CAREGUARD_CLINICAL_SPAN_AUGMENTATION_ENABLED:-false}
      SEMANTIC_INTENT_ROUTING_ENABLED: ${SEMANTIC_INTENT_ROUTING_ENABLED:-true}
      # Match the API timeout contract and the documented V4 Pro default.
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-60}
      DEEPSEEK_RETRIES_PER_BASE: ${DEEPSEEK_RETRIES_PER_BASE:-2}
      DEEPSEEK_RETRY_BACKOFF_SECONDS: ${DEEPSEEK_RETRY_BACKOFF_SECONDS:-0.9}
      DEEPSEEK_REQUIRED: ${DEEPSEEK_REQUIRED:-false}
      LLM_DEEPSEEK_ONLY: ${LLM_DEEPSEEK_ONLY:-true}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      YESCALE_API_KEY: ${YESCALE_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.yescale.io/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-large}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-6}
      EXTERNAL_DDI_ENABLED: ${EXTERNAL_DDI_ENABLED:-false}
      EXTERNAL_DDI_TIMEOUT_SECONDS: ${EXTERNAL_DDI_TIMEOUT_SECONDS:-1.5}
      CAREGUARD_DRUGBANK_SQLITE_ENABLED: ${CAREGUARD_DRUGBANK_SQLITE_ENABLED:-true}
      CAREGUARD_DRUGBANK_REQUIRED: ${CAREGUARD_DRUGBANK_REQUIRED:-false}
      CAREGUARD_DRUGBANK_MANIFEST_INTEGRITY_REQUIRED: ${CAREGUARD_DRUGBANK_MANIFEST_INTEGRITY_REQUIRED:-true}
      CAREGUARD_DRUGBANK_SQLITE_PATH: ${CAREGUARD_DRUGBANK_SQLITE_PATH:-/var/lib/clara/drugbank/ddi_index.sqlite}
      CAREGUARD_DRUGBANK_MANIFEST_PATH: ${CAREGUARD_DRUGBANK_MANIFEST_PATH:-/var/lib/clara/drugbank/manifest.json}
      CAREGUARD_MEDICATION_CLARIFICATION_ENABLED: ${CAREGUARD_MEDICATION_CLARIFICATION_ENABLED:-false}
      CAREGUARD_WORDING_RENDERER_ENABLED: ${CAREGUARD_WORDING_RENDERER_ENABLED:-false}
      COUNCIL_LLM_SHADOW_ENABLED: ${COUNCIL_LLM_SHADOW_ENABLED:-false}
      COUNCIL_MODEL_DISCLOSURE_ENABLED: ${COUNCIL_MODEL_DISCLOSURE_ENABLED:-false}
      COUNCIL_LLM_MAX_TOKENS: ${COUNCIL_LLM_MAX_TOKENS:-1200}
      SCRIBE_ASR_PRIMARY: ${SCRIBE_ASR_PRIMARY:-whisper}
      SCRIBE_ASR_FALLBACK: ${SCRIBE_ASR_FALLBACK:-whisper}
      SCRIBE_ASR_LANGUAGE: ${SCRIBE_ASR_LANGUAGE:-vi}
      SCRIBE_ASR_TIMEOUT_SECONDS: ${SCRIBE_ASR_TIMEOUT_SECONDS:-150}
      SCRIBE_ASR_CODE_SWITCHING: ${SCRIBE_ASR_CODE_SWITCHING:-true}
      SCRIBE_MEDICAL_CORRECTION_ENABLED: ${SCRIBE_MEDICAL_CORRECTION_ENABLED:-false}
      SCRIBE_GOOGLE_PROJECT_ID: ${SCRIBE_GOOGLE_PROJECT_ID:-}
      SCRIBE_GOOGLE_LOCATION: ${SCRIBE_GOOGLE_LOCATION:-us}
      SCRIBE_GOOGLE_RECOGNIZER: ${SCRIBE_GOOGLE_RECOGNIZER:-_}
      SCRIBE_PHOWHISPER_BASE_URL: ${SCRIBE_PHOWHISPER_BASE_URL:-}
      SCRIBE_PHOWHISPER_API_KEY: ${SCRIBE_PHOWHISPER_API_KEY:-}
      SCRIBE_PHOWHISPER_MODEL: ${SCRIBE_PHOWHISPER_MODEL:-phowhisper-large}
      SCRIBE_PHOWHISPER_TIMEOUT_SECONDS: ${SCRIBE_PHOWHISPER_TIMEOUT_SECONDS:-30}
      SCRIBE_PHOWHISPER_RETRIES: ${SCRIBE_PHOWHISPER_RETRIES:-1}
      SCRIBE_PHOWHISPER_RETRY_BACKOFF_SECONDS: ${SCRIBE_PHOWHISPER_RETRY_BACKOFF_SECONDS:-0.25}
      RAG_SCRIBE_STREAMING_ENABLED: ${RAG_SCRIBE_STREAMING_ENABLED:-false}
      RAG_SCRIBE_DIARIZATION_ENABLED: ${RAG_SCRIBE_DIARIZATION_ENABLED:-false}
      RAG_SCRIBE_CONSENT_REQUIRED: ${RAG_SCRIBE_CONSENT_REQUIRED:-false}
      RAG_SCRIBE_TEMPLATES_ENABLED: ${RAG_SCRIBE_TEMPLATES_ENABLED:-false}
      RAG_SCRIBE_CODING_ENABLED: ${RAG_SCRIBE_CODING_ENABLED:-false}
      RAG_SCRIBE_SIGN_WORKFLOW_ENABLED: ${RAG_SCRIBE_SIGN_WORKFLOW_ENABLED:-false}
      RAG_SCRIBE_EXPORT_ENABLED: ${RAG_SCRIBE_EXPORT_ENABLED:-false}
      RAG_SCRIBE_FHIR_EXPORT_ENABLED: ${RAG_SCRIBE_FHIR_EXPORT_ENABLED:-false}
      RAG_SCRIBE_GROUNDING_ENABLED: ${RAG_SCRIBE_GROUNDING_ENABLED:-false}
      RAG_SCRIBE_STRUCTURED_EXTRACTION_ENABLED: ${RAG_SCRIBE_STRUCTURED_EXTRACTION_ENABLED:-false}
      RAG_SCRIBE_EM_CPT_CODING_ENABLED: ${RAG_SCRIBE_EM_CPT_CODING_ENABLED:-false}
      RAG_SCRIBE_QUALITY_METRICS_ENABLED: ${RAG_SCRIBE_QUALITY_METRICS_ENABLED:-false}
      RAG_SCRIBE_WER_REPORTING_ENABLED: ${RAG_SCRIBE_WER_REPORTING_ENABLED:-false}
      RAG_SCRIBE_FHIR_COMPOSITION_ENABLED: ${RAG_SCRIBE_FHIR_COMPOSITION_ENABLED:-false}
      RAG_SCRIBE_ADDENDUM_ENABLED: ${RAG_SCRIBE_ADDENDUM_ENABLED:-false}
      RAG_SCRIBE_SPECIALTY_TEMPLATES_ENABLED: ${RAG_SCRIBE_SPECIALTY_TEMPLATES_ENABLED:-false}
      RAG_SCRIBE_EVAL_GATE_ENABLED: ${RAG_SCRIBE_EVAL_GATE_ENABLED:-false}
      ENCODER_SLM_SHADOW_ENABLED: ${ENCODER_SLM_SHADOW_ENABLED:-false}
      ENCODER_SLM_SHADOW_URL: ${ENCODER_SLM_SHADOW_URL:-}
      ENCODER_SLM_SHADOW_API_KEY: ${ENCODER_SLM_SHADOW_API_KEY:-}
      ENCODER_SLM_SHADOW_MODEL_ID: ${ENCODER_SLM_SHADOW_MODEL_ID:-}
      ENCODER_SLM_SHADOW_TIMEOUT_MS: ${ENCODER_SLM_SHADOW_TIMEOUT_MS:-750}
      ENCODER_SLM_SHADOW_MAX_INPUT_CHARS: ${ENCODER_SLM_SHADOW_MAX_INPUT_CHARS:-1200}
      RAG_EXTERNAL_CONNECTORS_ENABLED: ${RAG_EXTERNAL_CONNECTORS_ENABLED:-true}
      RAG_EXTERNAL_TIMEOUT_SECONDS: ${RAG_EXTERNAL_TIMEOUT_SECONDS:-4}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_STRATEGY: ${RAG_RERANKER_STRATEGY:-embedding}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-embedding-cosine-reranker-v1}
      RAG_RERANKER_TOP_N: ${RAG_RERANKER_TOP_N:-12}
      RAG_RERANKER_TIMEOUT_MS: ${RAG_RERANKER_TIMEOUT_MS:-250}
      RAG_RERANKER_LLM_ENABLED: ${RAG_RERANKER_LLM_ENABLED:-false}
      RAG_RERANKER_LLM_TOP_N: ${RAG_RERANKER_LLM_TOP_N:-6}
      RAG_RERANKER_LLM_MIN_SCORE: ${RAG_RERANKER_LLM_MIN_SCORE:-0.55}
      RAG_RERANKER_LLM_TIMEOUT_MS: ${RAG_RERANKER_LLM_TIMEOUT_MS:-900}
      RAG_NLI_ENABLED: ${RAG_NLI_ENABLED:-true}
      RAG_NLI_STRATEGY: ${RAG_NLI_STRATEGY:-heuristic}
      RAG_NLI_TIMEOUT_MS: ${RAG_NLI_TIMEOUT_MS:-180}
      RAG_NLI_LLM_ENABLED: ${RAG_NLI_LLM_ENABLED:-false}
      RAG_NLI_LLM_TIMEOUT_MS: ${RAG_NLI_LLM_TIMEOUT_MS:-900}
      RAG_NLI_MIN_CONFIDENCE: ${RAG_NLI_MIN_CONFIDENCE:-0.35}
      RAG_GRAPHRAG_ENABLED: ${RAG_GRAPHRAG_ENABLED:-false}
      RAG_BIOMEDICAL_RERANK_ENABLED: ${RAG_BIOMEDICAL_RERANK_ENABLED:-false}
      SYNTHESIS_V2_ENABLED: ${SYNTHESIS_V2_ENABLED:-true}
      RESEARCH_QUERY_DECOMPOSITION_ENABLED: ${RESEARCH_QUERY_DECOMPOSITION_ENABLED:-true}
      RESEARCH_GAP_FILL_ENABLED: ${RESEARCH_GAP_FILL_ENABLED:-true}
      RESEARCH_RECENCY_TRUST_RANKING_ENABLED: ${RESEARCH_RECENCY_TRUST_RANKING_ENABLED:-true}
      RESEARCH_PICO_ENABLED: ${RESEARCH_PICO_ENABLED:-true}
      RESEARCH_GRADE_ENABLED: ${RESEARCH_GRADE_ENABLED:-true}
      RESEARCH_CONSENSUS_ENABLED: ${RESEARCH_CONSENSUS_ENABLED:-true}
      RESEARCH_CLAIM_TRACE_ENABLED: ${RESEARCH_CLAIM_TRACE_ENABLED:-true}
      RESEARCH_ROLE_ADAPTIVE_OUTPUT_ENABLED: ${RESEARCH_ROLE_ADAPTIVE_OUTPUT_ENABLED:-true}
      DEEP_BETA_REPORT_MIN_WORDS: ${DEEP_BETA_REPORT_MIN_WORDS:-2000}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARXNG_TIMEOUT_SECONDS: ${SEARXNG_TIMEOUT_SECONDS:-3}
      SEARXNG_CRAWL_ALLOWED_DOMAINS: ${SEARXNG_CRAWL_ALLOWED_DOMAINS:-who.int,nih.gov,ncbi.nlm.nih.gov,pubmed.ncbi.nlm.nih.gov,open.fda.gov,fda.gov,dailymed.nlm.nih.gov,clinicaltrials.gov,ema.europa.eu,bmj.com,thelancet.com}
      ML_UVICORN_WORKERS: ${ML_UVICORN_WORKERS:-8}
    depends_on:
      asr:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      - default
      - clara_local
    ports:
      - "127.0.0.1:${APP_ML_PORT:-8110}:8010"
    # Licensed artifact bundle is ML-only; the host path must be provisioned
    # from approved DrugBank material before strict mode is enabled.
    volumes:
      - ${CAREGUARD_DRUGBANK_ARTIFACT_HOST_DIR:-./data/drugbank}:/var/lib/clara/drugbank
    # Container healthcheck (Requirement 6.4). Uses the ML /health liveness
    # endpoint (unchanged shape) via the in-image python interpreter, since the
    # slim base image ships no curl/wget. Additive: orchestration liveness only.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    restart: unless-stopped
    environment:
      # The SearXNG image maps this to server.secret_key. Unlike local compose,
      # production has no fallback: the managed deploy environment must supply
      # a unique high-entropy value.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is required in production}
      BASE_URL: ${SEARXNG_PUBLIC_BASE_URL:-http://127.0.0.1:8888/}
      INSTANCE_NAME: CLARA SearXNG
      UWSGI_WORKERS: 2
      UWSGI_THREADS: 2
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${APP_SEARXNG_PORT:-8888}:8080"

  asr:
    image: ${ASR_IMAGE}
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
    volumes:
      - clara_asr_models:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${APP_ASR_PORT:-8190}:8090"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/ready', timeout=120)"
      interval: 30s
      timeout: 120s
      retries: 3
      start_period: 180s

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_SERVER_API_PROXY: ${NEXT_SERVER_API_PROXY:-http://api:8000/api/v1}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${APP_WEB_PORT:-3100}:3000"
    # Container healthcheck (Requirement 6.4). Probes the web root over HTTP via
    # busybox wget (present in the node:alpine runtime image). Additive:
    # orchestration liveness only.
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://127.0.0.1:3000/"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  clara_api_data:
  clara_asr_models:

networks:
  clara_local:
    external: true
    name: clara-local_default
