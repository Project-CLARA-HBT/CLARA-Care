use_default_settings: true

general:
  instance_name: "CLARA SearXNG"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  # SearXNG replaces this documented placeholder with $SEARXNG_SECRET at
  # runtime. The repository never contains a deployed session-signing value.
  secret_key: "ultrasecretkey"
