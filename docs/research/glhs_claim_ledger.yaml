    dataset_version: "GOV-TOCTOU-CORPUS-20260819"
    statistical_gate: "Zero unauthorized commits across 600 PostgreSQL TOCTOU repetition runs and GOV-RACE schedules; 100% rejection of post-revocation admissions."
    formal_gate: "TLA+ model checking verifying policy-state serializability without lock escalation deadlocks."
    reviewer: "Governance & Systems Architecture Lead"
    approval_date: null
    expiration_condition: "Expires upon alteration of lock ordering, consent epoch schema, or policy resolution logic."

