  - claim_id: "C-006"
    proposed_claim: "Retry/idempotency yields exactly one durable transition"
    current_status: "partial"
    gate_passed: false
    publication_rule: "Required for systems claim; cannot claim full fault tolerance until crash matrix passes"
    gating_rules:
      - "Implement proposal idempotency uniqueness and deterministic stored-result replay."
      - "Pass FAULT-ATOMIC crash injection matrix (kill before commit, kill during outbox, timeout retry)."
      - "Verify zero partial state transitions or duplicate clinical records."
    required_evidence: "Crash matrix and idempotency uniqueness"
    allowed_phrasing:
      - "Idempotency keys and deterministic stored-result replay ensure that client retries and gateway crashes yield exactly one durable state transition."
      - "GLHS provides exactly-once external semantics and at-least-once internal processing."
    forbidden_phrasing:
      - "Claiming crash-proof operation without complete fault injection matrix verification."
      - "Claiming invention of transactional outbox or idempotency tables."
    source_artifact_ids:
