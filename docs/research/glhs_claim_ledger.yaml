    statistical_gate: "Exactly one applied transition record per proposal under 100% of kill/retry/timeout fault injection runs (zero split-brain or duplicate state updates)."
    formal_gate: "TLA+ crash/recovery specification showing state consistency and idempotency invariance under node failures."
    reviewer: "Reliability & Distributed Systems Lead"
    approval_date: null
    expiration_condition: "Expires upon modifications to idempotency key generation, outbox staging, or crash recovery handlers."

