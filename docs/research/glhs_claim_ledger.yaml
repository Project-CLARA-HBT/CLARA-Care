description: >
  Claim ledger for the GLHS (Governed Longitudinal Health State) research program and journal revisions.
  Enforces claim gating rules, required empirical/formal evidence, allowed wording, and forbidden phrasing.
  CI/CD consistency checks reject any paper sentence tagged to a claim whose gate has not passed.

claims:
  - claim_id: "C-001"
    proposed_claim: "Exact model-visible disclosure is cryptographically bound to the proposal and commit"
    current_status: "partial"
    gate_passed: false
    publication_rule: "No headline claim until all adversarial tests pass"
    gating_rules:
      - "Pass 100% of SEC-DISC context substitution, omission, cross-proposal replay, stale-evidence, and post-inference policy-change test suites."
      - "Independent verifier pass with zero bypasses."
      - "RFC 8785 canonicalization conformance vectors match cross-language."
    required_evidence: "Substitution/replay/omission attacks; independent verifier; canonicalization vectors"
    allowed_phrasing:
      - "Exact model-visible disclosure is cryptographically bound to the proposal and commit on evaluated snapshot-bound paths."
      - "GLHS binds the exact Task-Bounded Health State Snapshot (THSS) canonical Merkle digest to persistent proposals."
      - "A Governed State Transition (GST) verifies the canonical Merkle digest of the disclosed context before admitting durable mutations."
    forbidden_phrasing:
      - "GLHS guarantees universal context binding across all unverified or unbound endpoints."
      - "Any headline claim of cryptographic binding superiority before all adversarial tests pass."
      - "Claiming invention of cryptographic Merkle hashing or hash-based disclosure tracking."
      - "signed Merkle root"
    source_artifact_ids:
      - "GLHS-BINDING-ABLATION-20260819-01"
      - "GLHS-BA-POSTGRES-20260819-05"
      - "CANONICAL-V2-VECTORS-20260822"
    source_sha256: "caee52724665c351194c14cfa259389a695dd8b2d0729a0fa31886bb0c7474c2"
    code_sha: "af4e18e376ea24d1a9278777a92736c39aac8a64"
    dataset_version: "GLHS-SYNTH-V2-20260819"
    statistical_gate: "Zero undetected context substitutions, omissions, or replays (100% rejection in SEC-DISC suite; paired risk difference 1.0, 95% CI [1.0, 1.0], exact McNemar p < 1e-10; one-sided 95% UCB below risk ceiling)."
    formal_gate: "Deterministic canonicalization and SHA-256 second-preimage collision resistance proof over closed-world context frame."
    reviewer: "Security & Cryptography Track Lead"
    approval_date: null
    expiration_condition: "Expires upon modification to canonicalization profiles, hash preimage algorithms, or THSS serialization schema."

  - claim_id: "C-002"
    proposed_claim: "Commit authorization is fresh with respect to all governing policy/consent scopes"
    current_status: "withdrawn"
    gate_passed: false
    publication_rule: "Withdraw theorem until code and model agree"
    gating_rules:
      - "Persisted governance vector matches production schema."
      - "Shared-reader/exclusive-writer lock hierarchy implemented and verified in PostgreSQL."
      - "GOV-RACE concurrency schedules show zero unauthorized commits."
    required_evidence: "Persisted governance vector; shared-reader/exclusive-writer protocol; stale-governance schedules"
    allowed_phrasing:
      - "Commit authorization is revalidated against persisted governing policy epochs and monotonic consent event epochs under shared/exclusive locks on evaluated paths."
      - "GLHS prevents Time-of-Check to Time-of-Use (TOCTOU) authorization drift and A-B-A consent revocation blindness across the read-to-write interval."
    forbidden_phrasing:
      - "GLHS invented commit-time authorization (prior work: CommitGuard, Santos-Grueiro 2026)."
      - "Universal race-freedom claims while paper and production code lock modes diverge."
      - "Claiming policy-state serializability invention (prior work: MasuGate, Peng & Wu 2026)."
      - "Provenact"
    source_artifact_ids:
      - "GLHS-CONCURRENCY-REPETITION-V1-20260819"
      - "GOV-RACE-SCHEDULES-20260822"
    source_sha256: "pending_governance_vector_freeze"
