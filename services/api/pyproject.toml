[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clara-api"
version = "0.1.0"
description = "CLARA Backend API P0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.27.2",
  "markdown-it-py>=3.0.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "python-docx>=1.1.2",
  "psycopg[binary]>=3.2.3",
  # Security floor: python-jose >=3.4.0 clears the JWT "bomb"/algorithm-confusion
  # advisories (CVE-2024-33664, CVE-2024-33663). Resolved lock is already >=3.5.0.
  "python-jose[cryptography]>=3.4.0",
  # Security floor: python-multipart >=0.0.18 clears the multipart DoS
  # (CVE-2024-53981); the older ReDoS (CVE-2024-24762) was already covered.
  "python-multipart>=0.0.18",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "aiosqlite>=0.22.1",
  # Tesseract OCR fallback (medication-label scanning) — the system
  # `tesseract-ocr` binary + vie/eng language packs are installed in the image.
  "pytesseract>=0.3.13",
  "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.1",
  "hypothesis>=6.100.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clara_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's dependency-injection idiom calls Depends()/Query()/etc. in
# argument defaults on purpose; bugbear's "do not call in defaults" rule is a
# false positive for this framework, so ignore it project-wide.
ignore = ["B008", "E501", "B905"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true
