name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      target_branch:
        description: "Branch to release from"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-release-context:
    name: prepare release context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.ctx.outputs.release_tag }}
      release_sha: ${{ steps.ctx.outputs.release_sha }}
      release_ref: ${{ steps.ctx.outputs.release_ref }}
      short_sha: ${{ steps.ctx.outputs.short_sha }}
      registry_repo: ${{ steps.ctx.outputs.registry_repo }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch }}

      - name: Resolve release context
        id: ctx
        run: |
          release_tag="$(bash scripts/release/compute_next_semver.sh "${{ github.event.inputs.bump }}")"
          release_sha="$(git rev-parse HEAD)"
          # Evaluate the immutable SHA before any release tag is created.
          release_ref="${release_sha}"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "[error] invalid release tag: $release_tag"
            exit 1
          fi

          short_sha="${release_sha:0:7}"
          registry_repo="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "release_tag=$release_tag"
            echo "release_sha=$release_sha"
            echo "release_ref=$release_ref"
            echo "short_sha=$short_sha"
            echo "registry_repo=$registry_repo"
          } >> "$GITHUB_OUTPUT"

  clara-eval-release-gate:
    name: CLARA-Eval VN locked release gate
    runs-on: ubuntu-latest
    needs: [prepare-release-context]
    timeout-minutes: 45
    # A release cannot be built before the locked suite has emitted evidence.
    # The runner records missing live/locked inputs as not_measured and this
    # release config rejects them, rather than allowing a synthetic green gate.
    env:
      CLARA_EVAL_API_BASE_URL: ${{ secrets.CLARA_API_BASE_URL }}
      CLARA_EVAL_ML_BASE_URL: ${{ secrets.CLARA_ML_BASE_URL }}
      CLARA_EVAL_LOCKED_DATASET_REF: ${{ secrets.CLARA_EVAL_LOCKED_DATASET_REF }}
      CLARA_EVAL_LOCKED_DATASET_TOKEN: ${{ secrets.CLARA_EVAL_LOCKED_DATASET_TOKEN }}
      CLARA_EVAL_RELEASE_REF: ${{ needs.prepare-release-context.outputs.release_ref }}
      # Release evaluation is separately opt-in from nightly evaluation. The
      # approved manifest stays an Actions secret and is materialized only
      # under RUNNER_TEMP for this job.
      CLARA_EVAL_LIVE_EXECUTION_ENABLED: ${{ vars.CLARA_EVAL_RELEASE_LIVE_EXECUTION_ENABLED || 'false' }}
      CLARA_EVAL_LIVE_MANIFEST_JSON: ${{ secrets.CLARA_EVAL_RELEASE_LIVE_MANIFEST_JSON }}
      CLARA_EVAL_API_BEARER_TOKEN: ${{ secrets.CLARA_EVAL_API_BEARER_TOKEN }}
      CLARA_EVAL_ML_BEARER_TOKEN: ${{ secrets.CLARA_EVAL_ML_BEARER_TOKEN }}
      CLARA_EVAL_ML_INTERNAL_KEY: ${{ secrets.CLARA_EVAL_ML_INTERNAL_KEY }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-context.outputs.release_ref }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate locked dataset manifest
        run: |
          set -euo pipefail
          python -m evaluation.clara_eval.datasets.validate \
            --manifest evaluation/clara_eval/datasets/manifest.json \
            --repository-root .

      - name: Run locked CLARA-Eval VN release gate
        run: |
          set -euo pipefail
          eval_manifest=""
          trap 'if [ -n "${eval_manifest:-}" ]; then rm -f "${eval_manifest}"; fi' EXIT
          if [ "${CLARA_EVAL_LIVE_EXECUTION_ENABLED}" = "true" ]; then
            if [ -z "${CLARA_EVAL_LIVE_MANIFEST_JSON}" ]; then
              echo "::error::CLARA_EVAL_RELEASE_LIVE_MANIFEST_JSON is required when locked live evaluation is enabled"
              exit 1
            fi
            eval_manifest="${RUNNER_TEMP}/clara-eval-vn-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            umask 077
            EVAL_MANIFEST_PATH="${eval_manifest}" python - <<'PY'
            import os
            from pathlib import Path

            Path(os.environ["EVAL_MANIFEST_PATH"]).write_text(
                os.environ["CLARA_EVAL_LIVE_MANIFEST_JSON"], encoding="utf-8"
            )
            PY
            export CLARA_EVAL_LIVE_MANIFEST="${eval_manifest}"
          fi
          output="artifacts/clara-eval-vn/release-${{ needs.prepare-release-context.outputs.release_tag }}"
          python -m evaluation.clara_eval.run \
            --config evaluation/configs/release.yaml \
            --output "${output}"
          test -f "${output}/summary.md"
          test -f "${output}/metrics.json"
          test -f "${output}/ablations.csv"
          test -f "${output}/critical-errors.csv"
          test -f "${output}/model-manifest.json"
          test -f "${output}/dataset-manifest.json"
          test -f "${output}/retrieval-snapshot.json"
          test -f "${output}/latency-cost.json"
          test -f "${output}/confidence-intervals.json"

      - name: Upload locked release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clara-eval-vn-release-${{ needs.prepare-release-context.outputs.release_tag }}
          path: artifacts/clara-eval-vn/release-${{ needs.prepare-release-context.outputs.release_tag }}
          if-no-files-found: ignore
          retention-days: 90

  create-semver-tag:
    name: create semver tag after locked gate
    runs-on: ubuntu-latest
    needs: [prepare-release-context, clara-eval-release-gate]
    outputs:
      release_tag: ${{ needs.prepare-release-context.outputs.release_tag }}
      release_sha: ${{ needs.prepare-release-context.outputs.release_sha }}
    steps:
      - name: Checkout evaluated release SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release-context.outputs.release_sha }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push evaluated tag
        env:
          RELEASE_TAG: ${{ needs.prepare-release-context.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare-release-context.outputs.release_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "[error] tag already exists: ${RELEASE_TAG}"
            exit 1
          fi
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "release: ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

  build-push-images:
    name: build and push release images
    runs-on: ubuntu-latest
    needs: [prepare-release-context, clara-eval-release-gate, create-semver-tag]
    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release-context.outputs.release_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Build and push release images
        id: build
        run: |
          manifest_path="$(bash scripts/release/build_and_push_images.sh \
            --release-tag "${{ needs.prepare-release-context.outputs.release_tag }}" \
            --commit-sha "${{ needs.prepare-release-context.outputs.release_sha }}" \
            --registry "${{ needs.prepare-release-context.outputs.registry_repo }}")"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-manifest-${{ needs.prepare-release-context.outputs.release_tag }}
          path: ${{ steps.build.outputs.manifest_path }}
          if-no-files-found: error

      - name: Write standalone release SHA artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          sha_file="release-artifacts/release-sha-${{ needs.prepare-release-context.outputs.release_tag }}.txt"
          printf '%s\n' "${{ needs.prepare-release-context.outputs.release_sha }}" > "$sha_file"

      - name: Upload standalone release SHA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sha-${{ needs.prepare-release-context.outputs.release_tag }}
          path: release-artifacts/release-sha-${{ needs.prepare-release-context.outputs.release_tag }}.txt
          if-no-files-found: error

  publish-github-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: [prepare-release-context, create-semver-tag, build-push-images]
    steps:
      - name: Checkout release ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release-context.outputs.release_ref }}

      - name: Download release manifest artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-manifest-${{ needs.prepare-release-context.outputs.release_tag }}
          path: release-artifacts

      - name: Download standalone release SHA artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sha-${{ needs.prepare-release-context.outputs.release_tag }}
          path: release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${{ needs.prepare-release-context.outputs.release_tag }}"
          manifest="release-artifacts/image-manifest-${release_tag}.json"
          sha_file="release-artifacts/release-sha-${release_tag}.txt"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists. Keep existing notes."
          else
            gh release create "$release_tag" \
              --target "${{ needs.prepare-release-context.outputs.release_sha }}" \
              --title "$release_tag" \
              --generate-notes
          fi

          gh release upload "$release_tag" "$manifest" "$sha_file" --clobber

      - name: Release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- Tag: \`${{ needs.prepare-release-context.outputs.release_tag }}\`"
            echo "- Commit SHA: \`${{ needs.prepare-release-context.outputs.release_sha }}\`"
            echo "- Registry: \`${{ needs.prepare-release-context.outputs.registry_repo }}\`"
            echo "- Manifest: \`release-artifacts/image-manifest-${{ needs.prepare-release-context.outputs.release_tag }}.json\`"
            echo "- SHA artifact: \`release-artifacts/release-sha-${{ needs.prepare-release-context.outputs.release_tag }}.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
