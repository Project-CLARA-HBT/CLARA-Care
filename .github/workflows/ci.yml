name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ml: ${{ steps.filter.outputs.ml }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}
      scripts: ${{ steps.filter.outputs.scripts }}
      hackathon: ${{ steps.filter.outputs.hackathon }}
      python: ${{ steps.filter.outputs.python }}
      python_changed_files: ${{ steps.filter.outputs.python_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          zero = "0" * 40
          base = os.environ.get("BASE_SHA", "").strip()
          force_all = os.environ.get("FORCE_ALL", "false").lower() == "true"
          if force_all or not base or base == zero:
              files = subprocess.check_output(
                  ["git", "ls-files"], text=True
              ).splitlines()
          else:
              files = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
              ).splitlines()

          def any_path(predicate):
              return any(predicate(path) for path in files)

          python_files = [
              path
              for path in files
              if path.endswith(".py")
              and path.startswith(("services/", "scripts/", "evaluation/"))
              and os.path.isfile(path)
          ]
          outputs = {
              "api": any_path(lambda p: p.startswith("services/api/")),
              "ml": any_path(lambda p: p.startswith("services/ml/")),
              "web": any_path(
                  lambda p: p.startswith("apps/web/")
                  or p.startswith("contracts/consumer-terminology/")
                  or p == "apps/mobile/lib/experience/unified/unified_root.dart"
                  or (
                      p.startswith("apps/mobile/lib/core/consumer_terminology")
                      and p.endswith(".dart")
                  )
              ),
              "docs": any_path(lambda p: p.startswith("docs/")),
              "scripts": any_path(lambda p: p.startswith("scripts/")),
              "hackathon": any_path(
                  lambda p: p.startswith(("scripts/demo/", "data/demo/", "docs/hackathon/"))
              ),
              "docker": any_path(
                  lambda p: p.startswith("deploy/docker/")
                  or p == "apps/web/Dockerfile"
                  or p == ".env.example"
                  or (p.startswith("services/") and p.endswith("/Dockerfile"))
              ),
              "ci": any_path(
                  lambda p: p.startswith(".github/workflows/")
                  or p in {"Makefile", "README.md"}
              ),
              "python": bool(python_files)
              or any_path(
                  lambda p: p.startswith("services/") and p.endswith("/pyproject.toml")
              ),
              "python_changed_files": json.dumps(python_files, separators=(",", ":")),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  rendered = str(value).lower() if isinstance(value, bool) else value
                  output.write(f"{key}={rendered}\n")
          PY

  quality:
    name: docs-check + ruff + mypy
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.ml == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-quality.txt

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-quality.txt

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run docs-check
        run: |
          bash scripts/docs/check-docs-links.sh

      - name: Run Ruff
        env:
          PY_CHANGED_FILES: ${{ needs.changes.outputs.python_changed_files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch detected. Skip incremental Ruff."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          raw = os.getenv("PY_CHANGED_FILES", "").strip()
          files: list[str] = []
          if raw:
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"Unable to parse PY_CHANGED_FILES: {exc}")
                  sys.exit(1)
              if isinstance(parsed, list):
                  files = [str(item) for item in parsed if str(item).endswith(".py")]

          if not files:
              print("No changed Python files. Skip Ruff.")
              sys.exit(0)

          print("Running Ruff for files:")
          for file in files:
              print(f"- {file}")

          subprocess.run(["ruff", "check", "--extend-ignore", "B008", *files], check=True)
          PY

      - name: Run mypy
        env:
          PY_CHANGED_FILES: ${{ needs.changes.outputs.python_changed_files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch detected. Skip incremental mypy."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          raw = os.getenv("PY_CHANGED_FILES", "").strip()
          files: list[str] = []
          if raw:
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"Unable to parse PY_CHANGED_FILES: {exc}")
                  sys.exit(1)
              if isinstance(parsed, list):
                  files = [str(item) for item in parsed if str(item).endswith(".py")]

          if not files:
              print("No changed Python files. Skip mypy.")
              sys.exit(0)

          print("Running mypy for files:")
          for file in files:
              print(f"- {file}")

          subprocess.run(
              [
                  "mypy",
                  "--python-version",
                  "3.11",
                  "--ignore-missing-imports",
                  "--follow-imports=skip",
                  *files,
              ],
              check=True,
          )
          PY

  scripts-syntax:
    name: scripts syntax check
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.scripts == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate shell script syntax
        run: |
          set -euo pipefail
          while IFS= read -r script_file; do
            echo "bash -n ${script_file}"
            bash -n "${script_file}"
          done < <(find scripts -type f -name '*.sh' | sort)

  artifact-safety-policy:
    name: artifact safety policy
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.scripts == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject unsafe diagnostic artifact paths
        run: python3 scripts/security/check_ci_artifact_policy.py

  hackathon-artifacts-smoke:
    name: hackathon artifacts smoke
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.hackathon == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run artifact + KPI static smoke
        id: smoke
        run: |
          set -euo pipefail
          run_id="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

          python3 scripts/demo/generate_demo_artifacts.py --run-id "${run_id}"
          python3 scripts/demo/run_hackathon_kpis.py --mode static --run-id "${run_id}"

          test -f "artifacts/round2/${run_id}/kpi-report/kpi-report.json"
          test -f "artifacts/round2/${run_id}/test-report/test-report.json"
          test -f "artifacts/round2/${run_id}/fallback-proof/fallback-proof.json"

      - name: Upload hackathon smoke outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hackathon-artifacts-${{ github.run_id }}
          path: |
            artifacts/round2/${{ steps.smoke.outputs.run_id }}
            docs/hackathon/data-manifest.json
            docs/hackathon/kpi-snapshot.md
          if-no-files-found: ignore

  clara-eval-vn-smoke:
    name: CLARA-Eval VN smoke
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    # This is deliberately unconditional for CI events: the compact fixture
    # suite protects cross-service safety/routing contracts even in a UI-only
    # pull request.  It never requires production credentials or patient data.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate sanitized dataset manifest
        run: |
          set -euo pipefail
          python -m evaluation.clara_eval.datasets.validate \
            --manifest evaluation/clara_eval/datasets/manifest.json \
            --repository-root .

      - name: Run deterministic CLARA-Eval VN smoke
        id: eval
        run: |
          set -euo pipefail
          output="artifacts/clara-eval-vn/ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "output=${output}" >> "$GITHUB_OUTPUT"
          python -m evaluation.clara_eval.run \
            --config evaluation/configs/smoke.yaml \
            --output "${output}"
          test -f "${output}/summary.md"
          test -f "${output}/metrics.json"
          test -f "${output}/critical-errors.csv"
          test -f "${output}/model-manifest.json"
          test -f "${output}/dataset-manifest.json"
          test -f "${output}/retrieval-snapshot.json"

      - name: Upload sanitized CLARA-Eval VN smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clara-eval-vn-ci-smoke-${{ github.run_id }}
          path: ${{ steps.eval.outputs.output }}
          if-no-files-found: ignore
          retention-days: 14

  api-tests:
    name: pytest api
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.ci == 'true'
    env:
      DATABASE_URL: sqlite+pysqlite:////tmp/clara_api_ci.db
      AUTH_AUTO_PROVISION_USERS: "true"
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
      AUTH_BOOTSTRAP_ADMIN_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/api/pyproject.toml
            services/api/uv.lock

      - name: Install pytest
        run: |
          cd services/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run API pytest
        run: |
          if [ -d "services/api/tests" ]; then
            cd services/api
            pytest -q tests --junitxml=/tmp/pytest-api.xml
          else
            echo "No services/api/tests directory found. Skip API pytest."
          fi

      - name: Upload API pytest artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-api-${{ github.run_id }}
          path: /tmp/pytest-api.xml
          if-no-files-found: ignore

  ml-tests:
    name: pytest ml
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ml == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/ml/pyproject.toml
            services/ml/uv.lock

      - name: Install pytest
        run: |
          cd services/ml
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ML pytest
        run: |
          if [ -d "services/ml/tests" ]; then
            cd services/ml
            pytest -q tests --junitxml=/tmp/pytest-ml.xml
          else
            echo "No services/ml/tests directory found. Skip ML pytest."
          fi

      - name: Upload ML pytest artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-ml-${{ github.run_id }}
          path: /tmp/pytest-ml.xml
          if-no-files-found: ignore

  web-lint-build:
    name: web lint + build
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        run: |
          cd apps/web
          npm ci

      - name: Run web lint
        env:
          CI: "true"
        run: |
          cd apps/web
          npm run consumer-terminology:check
          npm run i18n:check
          npm run lint

      - name: Run web build
        run: |
          cd apps/web
          npm run build

  web-unit-tests:
    name: web unit tests (Vitest)
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        run: |
          cd apps/web
          npm ci

      - name: Run web unit tests
        env:
          CI: "true"
        run: |
          cd apps/web
          npm run test

  web-e2e:
    name: web E2E (Playwright production artifact)
    runs-on: ubuntu-latest
    needs: changes
    # The Playwright config builds the standalone Next artifact before the
    # browser starts; leave enough room for that bounded production build and
    # both desktop/mobile Chromium projects.
    timeout-minutes: 40
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        run: |
          cd apps/web
          npm ci

      - name: Install Chromium and system dependencies
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Run core experience E2E against production artifact
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd apps/web
          npm run test:e2e

      - name: Upload Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-web-${{ github.run_id }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  security-audit:
    name: security audit
    runs-on: ubuntu-latest
    needs: changes
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 20
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.ml == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            .github/requirements-security-audit.txt
            services/api/pyproject.toml
            services/api/uv.lock
            services/ml/pyproject.toml
            services/ml/uv.lock

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-security-audit.txt
          # Audit services/api + services/ml including dev dependencies
          # (Requirement 8.3 — audit dev deps where feasible, not runtime-only).
          pip install -e "services/api[dev]" -e "services/ml[dev]"
          # Supply-chain gate (Requirement 8.2 / design Property 21):
          # pip-audit exits non-zero on any known advisory, so this blocks on
          # CRITICAL and HIGH findings (all fixable findings are remediated on
          # the fix track, task 9.1). On pull requests this job is
          # continue-on-error, so findings are advisory; on default-branch
          # pushes to main the failure blocks the gate.
          #
          # The single unfixable finding is suppressed here and MUST stay in
          # sync with docs/security/accepted-findings.md:
          #   - GHSA-wj6h-64fc-37mp (CVE-2024-23342): ecdsa Minerva timing
          #     side-channel; no upstream fix, transitive via python-jose, and
          #     the ECDSA (ES*) code path is not exercised (CLARA uses HMAC).
          pip-audit \
            --progress-spinner=off \
            --ignore-vuln GHSA-wj6h-64fc-37mp

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Run npm audit
        run: |
          cd apps/web
          npm ci
          # Blocking gate (Requirement 8.2): fail on HIGH and CRITICAL runtime
          # advisories. Strengthened from critical-only. On pull requests this
          # job is continue-on-error (advisory); on default-branch pushes the
          # failure blocks the gate.
          npm audit --omit=dev --audit-level=high
          # Advisory dev-dependency audit (Requirement 8.3): surface HIGH/
          # CRITICAL findings in dev dependencies without failing the gate on
          # dev-only advisories. Any carried dev advisory must be recorded in
          # docs/security/accepted-findings.md.
          echo "::group::npm audit (including dev dependencies — advisory)"
          npm audit --audit-level=high || true
          echo "::endgroup::"

  docker-compose-smoke:
    name: docker compose smoke build
    runs-on: ubuntu-latest
    needs: changes
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.ml == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare env file
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          # Compose intentionally fails closed when the internal ML key is
          # absent. CI must use an ephemeral, non-production value rather than
          # weakening that contract or requiring a repository secret.
          if ! grep -q '^ML_INTERNAL_API_KEY=' .env || grep -q '^ML_INTERNAL_API_KEY=$' .env; then
            printf 'ML_INTERNAL_API_KEY=ci-%s\n' "$(openssl rand -hex 32)" >> .env
          fi

      - name: Docker compose build smoke
        run: |
          attempt=1
          max_attempts=3
          until docker compose --env-file .env -f deploy/docker/docker-compose.app.yml build api ml web; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Docker compose smoke build failed after ${max_attempts} attempts."
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "Retry docker compose build in ${sleep_seconds}s (attempt $((attempt + 1))/${max_attempts})..."
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done

      - name: Docker compose config validate
        run: |
          docker compose --env-file .env -f deploy/docker/docker-compose.app.yml config >/dev/null

      - name: Collect safe docker smoke diagnostics on failure
        if: failure()
        run: |
          # Do not export raw logs: they may contain a request body, transcript,
          # provider response, or an accidentally logged credential. Service
          # status is sufficient to triage the failed compose build in CI.
          docker compose --env-file .env -f deploy/docker/docker-compose.app.yml ps > /tmp/docker-smoke-status.txt || true
          python3 scripts/security/check_ci_artifact_safety.py /tmp/docker-smoke-status.txt

      - name: Upload safe docker smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-smoke-${{ github.run_id }}
          path: /tmp/docker-smoke-status.txt
          if-no-files-found: ignore

  container-scan:
    name: container scan (trivy)
    runs-on: ubuntu-latest
    needs: changes
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.ml == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare env file
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if ! grep -q '^ML_INTERNAL_API_KEY=' .env || grep -q '^ML_INTERNAL_API_KEY=$' .env; then
            printf 'ML_INTERNAL_API_KEY=ci-%s\n' "$(openssl rand -hex 32)" >> .env
          fi

      - name: Build images for scan
        env:
          COMPOSE_PROJECT_NAME: clara-scan
        run: |
          attempt=1
          max_attempts=3
          until docker compose --env-file .env -f deploy/docker/docker-compose.app.yml build api ml web; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Docker image build for container scan failed after ${max_attempts} attempts."
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "Retry docker image build in ${sleep_seconds}s (attempt $((attempt + 1))/${max_attempts})..."
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy container scan
        env:
          COMPOSE_PROJECT_NAME: clara-scan
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-reports
          images=("${COMPOSE_PROJECT_NAME}-api" "${COMPOSE_PROJECT_NAME}-ml" "${COMPOSE_PROJECT_NAME}-web")
          high_or_critical_exit=0
          critical_exit=0

          # Default-branch changes (pushes to main / manual dispatch) block on
          # HIGH and CRITICAL; pull requests run the same scan but treat HIGH as
          # advisory (this job is continue-on-error on PRs). Requirement 8.2,
          # design Property 21. Trivy runs with --ignore-unfixed so no-fix OS
          # findings are skipped; any carried image finding must have an Active
          # entry in docs/security/accepted-findings.md (.trivyignore).
          is_default_branch="false"
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            is_default_branch="true"
          fi

          for image in "${images[@]}"; do
            echo "Scanning ${image}..."
            trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format table \
              --output "/tmp/trivy-reports/${image}.txt" \
              "${image}" || true

            if ! trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --quiet \
              "${image}"; then
              echo "::warning::High/Critical vulnerabilities found in ${image}."
              high_or_critical_exit=1
            fi

            if ! trivy image \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --quiet \
              "${image}"; then
              echo "::error::Critical vulnerabilities found in ${image}."
              critical_exit=1
            fi
          done

          {
            echo "### Container Scan Summary"
            echo "- High/Critical detected: \`${high_or_critical_exit}\`"
            echo "- Critical detected: \`${critical_exit}\`"
            echo "- Default-branch change: \`${is_default_branch}\`"
            if [ "$critical_exit" -eq 1 ]; then
              echo "- Gate: **FAIL** (critical vulnerabilities present)"
            elif [ "$is_default_branch" = "true" ] && [ "$high_or_critical_exit" -eq 1 ]; then
              echo "- Gate: **FAIL** (high-severity vulnerabilities on default-branch change)"
            elif [ "$high_or_critical_exit" -eq 1 ]; then
              echo "- Gate: **PASS with warnings** (high-severity findings advisory on PR)"
            else
              echo "- Gate: **PASS**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$critical_exit" -eq 1 ]; then
            exit 1
          fi

          if [ "$is_default_branch" = "true" ] && [ "$high_or_critical_exit" -eq 1 ]; then
            echo "::error::High-severity vulnerabilities present on a default-branch change."
            exit 1
          fi

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-reports-${{ github.run_id }}
          path: /tmp/trivy-reports
          if-no-files-found: ignore

  required-ci-gates:
    name: required-ci-gates
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality
      - scripts-syntax
      - artifact-safety-policy
      - hackathon-artifacts-smoke
      - clara-eval-vn-smoke
      - api-tests
      - ml-tests
      - web-lint-build
      - web-unit-tests
      - web-e2e
      - security-audit
      - docker-compose-smoke
      - container-scan
    steps:
      - name: Evaluate required checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
          STRICT_PR_HARDENING: ${{ vars.CI_STRICT_PR_HARDENING || 'false' }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SCRIPTS_SYNTAX_RESULT: ${{ needs.scripts-syntax.result }}
          ARTIFACT_SAFETY_POLICY_RESULT: ${{ needs.artifact-safety-policy.result }}
          HACKATHON_ARTIFACTS_RESULT: ${{ needs.hackathon-artifacts-smoke.result }}
          CLARA_EVAL_SMOKE_RESULT: ${{ needs.clara-eval-vn-smoke.result }}
          API_TESTS_RESULT: ${{ needs.api-tests.result }}
          ML_TESTS_RESULT: ${{ needs.ml-tests.result }}
          WEB_RESULT: ${{ needs.web-lint-build.result }}
          WEB_UNIT_RESULT: ${{ needs.web-unit-tests.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          SECURITY_RESULT: ${{ needs.security-audit.result }}
          DOCKER_SMOKE_RESULT: ${{ needs.docker-compose-smoke.result }}
          CONTAINER_SCAN_RESULT: ${{ needs.container-scan.result }}
        run: |
          set -euo pipefail

          is_ok() {
            case "$1" in
              success|skipped)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          check_required_job() {
            job_name="$1"
            job_result="$2"
            if ! is_ok "$job_result"; then
              echo "::error::Blocking check failed: ${job_name} (result=${job_result})"
              return 1
            fi
            echo "Blocking check passed: ${job_name} (result=${job_result})"
            return 0
          }

          check_core_job() {
            job_name="$1"
            job_result="$2"
            # PRs still execute the complete suites, but known repository-wide
            # test/type debt is reported as advisory until it is repaired. Main
            # pushes, release tags, and manual runs remain fully blocking.
            if [ "$EVENT_NAME" = "pull_request" ] && [ "$strict_pr_hardening" != "true" ]; then
              if ! is_ok "$job_result"; then
                advisory_notes+=("${job_name}=${job_result}")
                echo "::warning::Advisory core check failed on PR: ${job_name} (result=${job_result})"
              else
                echo "Advisory core check passed: ${job_name} (result=${job_result})"
              fi
              return 0
            fi
            check_required_job "$job_name" "$job_result"
          }

          status=0
          advisory_notes=()
          policy_mode="core-only"

          strict_pr_hardening="false"
          case "$(echo "${STRICT_PR_HARDENING:-false}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes|y|on)
              strict_pr_hardening="true"
              ;;
          esac

          is_pr_to_main="false"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${EVENT_BASE_REF:-}" = "main" ]; then
            is_pr_to_main="true"
          fi

          check_core_job "quality" "$QUALITY_RESULT" || status=1
          check_required_job "scripts-syntax" "$SCRIPTS_SYNTAX_RESULT" || status=1
          check_required_job "artifact-safety-policy" "$ARTIFACT_SAFETY_POLICY_RESULT" || status=1
          check_required_job "hackathon-artifacts-smoke" "$HACKATHON_ARTIFACTS_RESULT" || status=1
          check_required_job "clara-eval-vn-smoke" "$CLARA_EVAL_SMOKE_RESULT" || status=1
          check_core_job "api-tests" "$API_TESTS_RESULT" || status=1
          check_core_job "ml-tests" "$ML_TESTS_RESULT" || status=1
          check_required_job "web-lint-build" "$WEB_RESULT" || status=1
          check_required_job "web-unit-tests" "$WEB_UNIT_RESULT" || status=1
          check_core_job "web-e2e" "$WEB_E2E_RESULT" || status=1

          should_block_hardening="false"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            should_block_hardening="true"
            policy_mode="production-blocking"
          elif [ "$is_pr_to_main" = "true" ] && [ "$strict_pr_hardening" = "true" ]; then
            should_block_hardening="true"
            policy_mode="strict-pr-blocking"
          else
            policy_mode="advisory-pr"
          fi

          if [ "$should_block_hardening" = "true" ]; then
            check_required_job "security-audit" "$SECURITY_RESULT" || status=1
            check_required_job "docker-compose-smoke" "$DOCKER_SMOKE_RESULT" || status=1
            check_required_job "container-scan" "$CONTAINER_SCAN_RESULT" || status=1
          else
            echo "Advisory mode: security-audit, docker-compose-smoke, container-scan are advisory."
            for advisory in \
              "security-audit:$SECURITY_RESULT" \
              "docker-compose-smoke:$DOCKER_SMOKE_RESULT" \
              "container-scan:$CONTAINER_SCAN_RESULT"; do
              name="${advisory%%:*}"
              result="${advisory##*:}"
              if ! is_ok "$result"; then
                advisory_notes+=("${name}=${result}")
                echo "::warning::Advisory check failed on PR: ${name} (result=${result})"
              fi
            done
          fi

          {
            echo "### CI Gate Summary"
            echo ""
            echo "- Event: \`${EVENT_NAME}\`"
            echo "- Ref: \`${EVENT_REF}\`"
            echo "- Base ref: \`${EVENT_BASE_REF}\`"
            echo "- Policy mode: \`${policy_mode}\`"
            echo "- Strict PR hardening: \`${strict_pr_hardening}\`"
            echo "- quality: \`${QUALITY_RESULT}\`"
            echo "- scripts-syntax: \`${SCRIPTS_SYNTAX_RESULT}\`"
            echo "- artifact-safety-policy: \`${ARTIFACT_SAFETY_POLICY_RESULT}\`"
            echo "- hackathon-artifacts-smoke: \`${HACKATHON_ARTIFACTS_RESULT}\`"
            echo "- clara-eval-vn-smoke: \`${CLARA_EVAL_SMOKE_RESULT}\`"
            echo "- api-tests: \`${API_TESTS_RESULT}\`"
            echo "- ml-tests: \`${ML_TESTS_RESULT}\`"
            echo "- web-lint-build: \`${WEB_RESULT}\`"
            echo "- web-unit-tests: \`${WEB_UNIT_RESULT}\`"
            echo "- web-e2e: \`${WEB_E2E_RESULT}\`"
            echo "- security-audit: \`${SECURITY_RESULT}\`"
            echo "- docker-compose-smoke: \`${DOCKER_SMOKE_RESULT}\`"
            echo "- container-scan: \`${CONTAINER_SCAN_RESULT}\`"
            if [ "${#advisory_notes[@]}" -gt 0 ]; then
              echo ""
              echo "#### Advisory Failures (PR only)"
              for note in "${advisory_notes[@]}"; do
                echo "- ${note}"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
