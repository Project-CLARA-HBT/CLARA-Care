name: Controlled deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable GHCR image tag to deploy (for example sha-abcdef0)"
        required: true
        type: string
      target_environment:
        description: "Protected GitHub environment with the target-host secrets"
        required: true
        default: production
        type: choice
        options: [staging, production]
      deployment_reason:
        description: "Release note or incident/change ticket"
        required: false
        default: manual-release
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: controlled-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: immutable-image and migration preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      image_tag: ${{ steps.context.outputs.image_tag }}
      registry_repo: ${{ steps.context.outputs.registry_repo }}
      release_name: ${{ steps.context.outputs.release_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Resolve immutable release context
        id: context
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            ''|*[!A-Za-z0-9._-]*)
              echo "image_tag must be a non-empty OCI-safe immutable tag" >&2
              exit 2
              ;;
          esac
          registry_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_name="${IMAGE_TAG}-${GITHUB_SHA:0:12}"
          {
            echo "image_tag=$IMAGE_TAG"
            echo "registry_repo=$registry_repo"
            echo "release_name=$release_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Controlled deployment preflight"
            echo "- image tag: \`$IMAGE_TAG\`"
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo "- reason: \`${{ inputs.deployment_reason }}\`"
            echo "- target: \`${{ inputs.target_environment }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify every migration has a downgrade
        run: python3 scripts/ops/check_migration_downgrade.py services/api/alembic/versions

      - name: Authenticate to GHCR for manifest checks
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable release images exist
        env:
          IMAGE_TAG: ${{ steps.context.outputs.image_tag }}
          REGISTRY_REPO: ${{ steps.context.outputs.registry_repo }}
        run: |
          set -euo pipefail
          for service in api ml asr web; do
            docker manifest inspect "${REGISTRY_REPO}/clara-${service}:${IMAGE_TAG}" >/dev/null
          done

  deploy:
    name: deploy on controlled host
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_environment }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER || 'root' }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/clara-care' }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://theclaracare.com' }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME || github.actor }}
      IMAGE_TAG: ${{ needs.preflight.outputs.image_tag }}
      REGISTRY_REPO: ${{ needs.preflight.outputs.registry_repo }}
      RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

      - name: Validate controlled-host inputs
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          for required in DEPLOY_HOST DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_ENV_FILE GHCR_PULL_TOKEN; do
            if [ -z "${!required}" ]; then
              echo "Missing protected deployment input: $required" >&2
              exit 2
            fi
          done
          case "$DEPLOY_ROOT" in
            /opt/clara-care|/opt/clara-care/*) ;;
            *) echo "DEPLOY_ROOT must stay under /opt/clara-care" >&2; exit 2 ;;
          esac

      - name: Configure pinned SSH trust
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/ssh-config" <<EOF
          Host clara-target
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile $HOME/.ssh/id_ed25519
            UserKnownHostsFile $HOME/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
          EOF
          chmod 600 "$RUNNER_TEMP/ssh-config"

      - name: Assemble release bundle without source worktree
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/clara-release/$RELEASE_NAME"
          mkdir -p "$bundle/deploy/docker" "$bundle/scripts/deploy" "$bundle/scripts/ops"
          install -m 644 deploy/docker/docker-compose.deploy.yml "$bundle/deploy/docker/docker-compose.deploy.yml"
          install -m 755 scripts/deploy/deploy_release_bundle.sh "$bundle/scripts/deploy/deploy_release_bundle.sh"
          install -m 755 scripts/ops/validate_runtime_env.sh "$bundle/scripts/ops/validate_runtime_env.sh"
          printf 'API_IMAGE=%s/clara-api:%s\nML_IMAGE=%s/clara-ml:%s\nASR_IMAGE=%s/clara-asr:%s\nWEB_IMAGE=%s/clara-web:%s\n' \
            "$REGISTRY_REPO" "$IMAGE_TAG" "$REGISTRY_REPO" "$IMAGE_TAG" \
            "$REGISTRY_REPO" "$IMAGE_TAG" "$REGISTRY_REPO" "$IMAGE_TAG" \
            > "$bundle/images.env"
          printf '{"source_sha":"%s","image_tag":"%s","workflow_run":"%s"}\n' \
            "$GITHUB_SHA" "$IMAGE_TAG" "$GITHUB_RUN_ID" > "$bundle/release.json"
          tar -C "$RUNNER_TEMP/clara-release" -czf "$RUNNER_TEMP/clara-release.tgz" "$RELEASE_NAME"

      - name: Install protected environment and release bundle on target
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/ssh-config" clara-target \
            "install -d -m 700 '$DEPLOY_ROOT' '$DEPLOY_ROOT/releases' '$DEPLOY_ROOT/backups'; rm -rf '$DEPLOY_ROOT/releases/.incoming-$RELEASE_NAME'; install -d -m 700 '$DEPLOY_ROOT/releases/.incoming-$RELEASE_NAME'"
          # The secret crosses the encrypted SSH channel over stdin only; it is
          # never a command argument, process environment on the target, or log.
          printf '%s\n' "$DEPLOY_ENV_FILE" | ssh -F "$RUNNER_TEMP/ssh-config" clara-target \
            "umask 077; install -m 600 /dev/stdin '$DEPLOY_ROOT/.env'"
          scp -F "$RUNNER_TEMP/ssh-config" "$RUNNER_TEMP/clara-release.tgz" \
            "clara-target:$DEPLOY_ROOT/releases/.incoming-$RELEASE_NAME/release.tgz"
          ssh -F "$RUNNER_TEMP/ssh-config" clara-target \
            "set -eu; cd '$DEPLOY_ROOT/releases/.incoming-$RELEASE_NAME'; tar -xzf release.tgz; rm release.tgz; test -x '$RELEASE_NAME/scripts/deploy/deploy_release_bundle.sh'; mv '$RELEASE_NAME' '$DEPLOY_ROOT/releases/$RELEASE_NAME'; rmdir '$DEPLOY_ROOT/releases/.incoming-$RELEASE_NAME'"

      - name: Authenticate target host to GHCR without argv secrets
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -F "$RUNNER_TEMP/ssh-config" clara-target \
            "docker login ghcr.io --username '$GHCR_PULL_USERNAME' --password-stdin"

      - name: Deploy, migrate, and run host-local smoke checks
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/ssh-config" clara-target \
            "'$DEPLOY_ROOT/releases/$RELEASE_NAME/scripts/deploy/deploy_release_bundle.sh' --root-dir '$DEPLOY_ROOT' --release-dir '$DEPLOY_ROOT/releases/$RELEASE_NAME'"

      - name: Verify public routing and browser security headers
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/public-headers.txt"
          curl --fail --silent --show-error --location --max-time 15 --dump-header "$headers" --output /dev/null "$PUBLIC_BASE_URL/"
          for header in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy permissions-policy; do
            grep -qi "^${header}:" "$headers" || { echo "Missing public header: $header" >&2; exit 1; }
          done
          phr_status="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "$PUBLIC_BASE_URL/phr/shared/not-a-real-token")"
          if [ "$phr_status" != 200 ]; then
            echo "Public PHR viewer route must be reachable without authentication, got $phr_status" >&2
            exit 1
          fi

      - name: Record non-sensitive deployment receipt
        if: always()
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/ssh-config" clara-target \
            "docker compose --project-name clara-app --env-file '$DEPLOY_ROOT/.env' --env-file '$DEPLOY_ROOT/releases/$RELEASE_NAME/images.env' -f '$DEPLOY_ROOT/releases/$RELEASE_NAME/deploy/docker/docker-compose.deploy.yml' ps --format json" \
            > "$RUNNER_TEMP/compose-status.json" || true
          python3 scripts/security/check_ci_artifact_safety.py --allow-missing "$RUNNER_TEMP/compose-status.json"

      - name: Upload sanitized deployment receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/compose-status.json
          if-no-files-found: ignore
