name: GLHS R4 Novelty & Reproducibility Gate

on:
  push:
    branches:
      - main
      - research/glhs-r4-novelty-hardening
      - research/glhs-q2-r2-experiments
  pull_request:
    branches:
      - main
      - research/glhs-r4-novelty-hardening
      - research/glhs-q2-r2-experiments
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glhs-r4-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Execute Secret Scan
        run: |
          python3 -c '
          import os, re, sys
          FORBIDDEN_PATTERNS = [
              re.compile(r"aura_prod_x7k9m2"),
              re.compile(r"sk-[a-zA-Z0-9]{32,}"),
          ]
          violations = []
          for root, dirs, files in os.walk("."):
              if any(ignored in root for ignored in [".git", ".venv", "node_modules"]):
                  continue
              for f in files:
                  if f.endswith((".py", ".json", ".md", ".csv", ".yml", ".yaml")):
                      p = os.path.join(root, f)
                      try:
                          text = open(p, errors="ignore").read()
                          for pat in FORBIDDEN_PATTERNS:
                              if pat.search(text):
                                  violations.append(f"{p}: matches {pat.pattern}")
                      except Exception as e:
                          pass
          if violations:
              print("SECURITY LEAK DETECTED:")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)
          print("No credentials or secrets detected.")
          '

  chronology-audit:
    name: Prospective Chronology Audit (R4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run R4 Chronology Validator
        run: |
          PYTHONPATH=services/api/src:services/ml/src:. python3 research/glhs_journal/q4_r4/chronology_validator_r4.py

  r4-admission-and-comparator-tests:
    name: R4 GRWC Admission & Comparator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Complete API Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./services/api[dev]"

      - name: Run R4 Pytest Suite
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/clara_api_ci.db
          AUTH_AUTO_PROVISION_USERS: "true"
          AUTH_BOOTSTRAP_ADMIN_ENABLED: "true"
          GLHS_RESEARCH_COMPARATORS_ENABLED: "true"
        run: |
          PYTHONPATH=services/api/src:services/ml/src:. pytest -q \
            services/api/tests/test_glhs_r4_admission.py \
            services/api/tests/test_glhs_r4_comparators.py \
            services/api/tests/test_glhs_comparator_policies.py \
            services/api/tests/test_glhs_current_state_insufficiency.py \
            services/api/tests/test_glhs_inference_envelope.py \
            services/api/tests/test_glhs_reason_codes.py \
            services/api/tests/test_glhs_attestation_receipts.py \
            services/api/tests/test_inference_attestation.py \
            services/api/tests/test_glhs_grwc_lineage.py \
            services/api/tests/test_glhs_mandatory_thss_binding.py

  offline-reproducibility-sweep:
    name: Hermetic Offline Reproducibility Sweep (E22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Complete API Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./services/api[dev]"

      - name: Run Hermetic R4 Sweep
        run: |
          python3 reproduce_q4_r4.py
