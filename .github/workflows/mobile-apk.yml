name: Mobile APK

# Builds a release Android APK for the CLARA Flutter app with the modern
# experience enabled and the API base URL pointed at production, then uploads
# the APK as a downloadable artifact.
#
# Uses only first-party actions/* (org allow-list friendly) and installs
# Flutter manually. The Android SDK is preinstalled on ubuntu-latest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (stable)
        run: |
          set -euo pipefail
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter setup
        run: |
          set -euo pipefail
          flutter --version
          flutter config --no-analytics
          flutter precache --android

      - name: Verify signed-release inputs
        env:
          CLARA_RELEASE_STORE_BASE64: ${{ secrets.CLARA_RELEASE_STORE_BASE64 }}
          CLARA_RELEASE_STORE_PASSWORD: ${{ secrets.CLARA_RELEASE_STORE_PASSWORD }}
          CLARA_RELEASE_KEY_ALIAS: ${{ secrets.CLARA_RELEASE_KEY_ALIAS }}
          CLARA_RELEASE_KEY_PASSWORD: ${{ secrets.CLARA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in CLARA_RELEASE_STORE_BASE64 CLARA_RELEASE_STORE_PASSWORD CLARA_RELEASE_KEY_ALIAS CLARA_RELEASE_KEY_PASSWORD; do
            if [ -z "${!required}" ]; then
              echo "Missing required protected mobile release signing input: ${required}" >&2
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/clara-release.jks"
          printf '%s' "$CLARA_RELEASE_STORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          chmod 600 "$key_path"
          {
            echo "ORG_GRADLE_PROJECT_CLARA_RELEASE_STORE_FILE=$key_path"
            echo "ORG_GRADLE_PROJECT_CLARA_RELEASE_STORE_PASSWORD=$CLARA_RELEASE_STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_CLARA_RELEASE_KEY_ALIAS=$CLARA_RELEASE_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_CLARA_RELEASE_KEY_PASSWORD=$CLARA_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify Android project and INTERNET permission
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # This is committed main-manifest policy, not a CI mutation. A release
          # package without network permission must fail rather than being fixed
          # behind the source tree's back.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -n "android.permission.INTERNET" "$MANIFEST" || { echo "INTERNET permission missing"; exit 1; }

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=MOBILE_EXPERIENCE_V2_ENABLED=true \
            --dart-define=CLARA_API_BASE_URL=https://theclaracare.com

      - name: Verify APK is signed
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Stage APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/clara-mobile-${GITHUB_SHA:0:7}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clara-mobile-apk
          path: apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30
