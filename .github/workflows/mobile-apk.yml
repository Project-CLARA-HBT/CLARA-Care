name: Mobile APK

# Builds a release Android APK for the CLARA Flutter app with the modern
# experience enabled and the API base URL pointed at production, then uploads
# the APK as a downloadable artifact.
#
# Uses only first-party actions/* (org allow-list friendly) and installs
# Flutter manually. The Android SDK is preinstalled on ubuntu-latest.
# The repo commits no generated android/ folder (see apps/mobile/docs/branding.md),
# so the job generates it with `flutter create` before building.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (stable)
        run: |
          set -euo pipefail
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter setup
        run: |
          set -euo pipefail
          flutter --version
          flutter config --no-analytics
          flutter precache --android

      - name: Generate android project (repo commits none)
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name clara_mobile .
          else
            echo "android/ already present"
          fi
          # Flutter only auto-adds the INTERNET permission to the debug/profile
          # manifests, so a release APK generated by `flutter create` cannot make
          # network requests. Inject it into the main manifest (idempotent) so the
          # release build can reach the API.
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
            echo "Injected INTERNET permission"
          fi
          grep -n "android.permission.INTERNET" "$MANIFEST" || { echo "INTERNET permission missing"; exit 1; }

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=MOBILE_EXPERIENCE_V2_ENABLED=true \
            --dart-define=CLARA_API_BASE_URL=https://clara.thiennn.icu

      - name: Stage APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/clara-mobile-${GITHUB_SHA:0:7}.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clara-mobile-apk
          path: apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30
