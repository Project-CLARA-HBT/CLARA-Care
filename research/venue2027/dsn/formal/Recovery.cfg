; Recovery.cfg -- TLC model configuration for recovery.tla
; (DSN 2027, task DSN-X02_recovery_tla).
;
; Bounded model: 1-3 processes, 2-4 operations, bounded consent
; mutations and bounded at-least-once redeliveries (3 reproduces the
; DSN-CASE-04 triple broker replay). All values keep the state space
; finite and exhaustively checkable by TLC.
;
; TLC invocation (counterexample export to a VC3 trace file):
;   java -cp tla2tools.jar tlc2.TLC -config Recovery.cfg \
;        -dumptrace recovery_counterexample.txt recovery.tla
; TLC prints every invariant / property violation together with the
; full behavior trace; -dumptrace additionally writes the
; counterexample to disk for the Jepsen/Elle-style oracle review.
;
; NOTE (transparency): the DSN-X02 proof report records whether TLC
; actually executed in the producing environment. In the DSN-X02
; authoring environment no Java runtime and no tla2tools.jar were
; available, so model checking was NOT_RUN; the spec and this
; configuration are nonetheless complete and runnable as-is wherever
; java + tla2tools.jar exist.

SPECIFICATION Spec

; ---- required bounds -------------------------------------------------
CONSTANT
  OpCount = 3            \* 2..4 governed operations
  Procs = 2              \* 1..3 competing pipeline processes
  MaxEpochs = 2          \* bounded consent revoke/renew mutations
  MaxRedelivery = 3      \* at-least-once replay bound (DSN-CASE-04)

; ---- invariants (safety) ---------------------------------------------
INVARIANT
  TypeOK
  NoPhantomSuccess
  ExactlyOnceEffect
  ReceiptConsistency
  OutboxIsGrounded
  RecoveryFailClosed

; ---- temporal properties (liveness / durability) ----------------------
PROPERTY
  NoCommittedThenLost

; ---- fairness settings (repeatable across runs) ----------------------
; Fairness is defined INSIDE Spec (recovery.tla, action Fairness):
;   WF_vars(Recovery(p))        for every p in 1..Procs
;   WF_vars(\E m \in OpSet : ConsumerReplay(m))
;   WF_vars(Authorize(p))       for every p in 1..Procs
; Crash and Tamper are intentionally left unfair (adversarial events
; need not occur). Keeping fairness in the spec keeps every run of
; this config repeatable and byte-identical in its checking scope.

; ---- counterexample export -------------------------------------------
; TLC flag used for export (passed on the command line, not here):
;   -dumptrace <file> : write each violating behavior as a VC3 trace
; The task oracle consumes the trace to witness injected duplicate
* effects or phantom successes; review is manual per CASE_MATRIX.md.

; ---- view / symmetry --------------------------------------------------
; No symmetry set is declared: symmetric shrinking risks masking
; receipt-vs-row mismatches across processes, which is precisely the
; disagreement this study hunts for.
