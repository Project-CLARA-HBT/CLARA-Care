# =============================================================================
# CLARA-Care 2027 shared task SH-baseline_registry (Phase P03, shared)
# =============================================================================
# Purpose
# -------
# Program-level provenance registry for every comparator used across the nine
# venue studies (ACNS, AIME, COMPSAC, DIMVA, DSN, IFIP_SEC, POPETS, PST,
# SACMAT). Each entry records where the baseline came from (upstream source URL
# + revision), under what license it may be used, what algorithm class it
# implements, its pinned config, data rights, the parity fixture that will
# prove fidelity, the exact exec command, and an honest fidelity status.
#
# Core invariants (EXECUTION_CONTRACT.md rule 8)
# ----------------------------------------------
# 1. Never replace an unavailable baseline with a toy implementation and keep
#    the same name. If an upstream cannot be pinned, the entry is
#    UNAVAILABLE_NOT_RUN and stays that way until a real revision is verified.
# 2. Never invent an upstream hash. Every revision below was resolved live via
#    `git ls-remote` (tags/HEAD) or an official publication endpoint on
#    2026-11-15 (UTC). Provenance of verification is in `notes`.
# 3. FAITHFUL_PORT entries MUST declare a parity fixture reference.
# 4. Every entry MUST declare a license or be UNAVAILABLE_NOT_RUN.
# 5. All datasets are synthetic (see _shared/dataset_declarations.json); no
#    real patient records are used by any baseline.
#
# Schema of each entry (see tools/baseline_registry.py)
# -----------------------------------------------------
# name, venue(s), upstream_url, upstream_revision, license, algorithm_class,
# config, data_rights, parity_fixture, exec_command, fidelity_status, notes
#
# Version: 1.0.0 (2026-11-15)
# =============================================================================

schema_version: "1.0.0"
registry_date: "2026-11-15"
revision_provenance: >
  Upstream revisions resolved live on 2026-11-15 with `git ls-remote` against
  the upstream origin (tags/HEAD), or via official publisher endpoints (RFC
  Editor, NIST/CSRC, Docker Hub, PyPI). No revision identifier below is
  guessed. Entries that could not be pinned declare upstream_revision:
  UNAVAILABLE and fidelity_status: UNAVAILABLE_NOT_RUN.

