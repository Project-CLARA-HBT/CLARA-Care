    algorithm_class: "coarse-grained optimistic concurrency control (single global version profile)"
    config: >-
      Single global profile version counter per entity class; validate at
      commit against one global epoch; no per-entity readset tracking.
      Synthetic workload: medication/allergy/history/purpose grants,
      1-16 workers, Zipf skew per COMPSAC protocol.
    data_rights: "Synthetic dataset synthetic-compsac-2027; project-internal-synthetic license; no third-party data."
