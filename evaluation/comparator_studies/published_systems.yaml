# Published-system inventory for GLHS-Bench.
#
# This is an eligibility registry, not a results table.  A row is selectable
# only if `direct_empirical_comparison_allowed` is true *at freeze time* and
# every named artifact has passed its own fidelity validator.
#
# v2 (W3 comparator registry): each row additionally carries a
# `direct_comparison_status` from the closed set
#   DIRECTLY_COMPARABLE | MECHANISM_REFERENCE_ONLY | TASK_MISMATCH
#   | ASSET_GATED | NOT_COMPARABLE
# together with citation / primary_source / code_source / pinned_version /
# license / task_fit / read_semantics / write_semantics /
# authorization_semantics / concurrency_semantics / reason / adapter /
# fidelity_tests.
#
# Honesty rule: no nearest-neighbor system is an automatic direct GLHS/RIVF
# baseline without a same-task mapping.  Where a primary source has not yet
# been locally parsed, semantics fields record only the mechanism class
# inferred for registry mapping and are marked UNVERIFIED; code_source,
# pinned_version, license and adapter are marked UNVERIFIED/NONE_VERIFIED
# until an artifact is actually available and license-compatible.  A citation
# alone never licenses a numerical comparison.
schema_version: glhs-bench-published-system-registry.v1
revision: v2-nearest-neighbor
systems:
  microsoft_graphrag:
    kind: published_system
    title: Microsoft GraphRAG
    citation: Microsoft GraphRAG (2024-2026), https://github.com/microsoft/graphrag.git
    primary_source: https://github.com/microsoft/graphrag.git
    source_url: https://github.com/microsoft/graphrag.git
    code_source: https://github.com/microsoft/graphrag.git
    pinned_release: v3.1.0
    pinned_version: v3.1.0
    pinned_commit: 7fc6607edda3d387d23e52ededbf8a75b6730f97
    license: MIT
    protocol_fit: retrieval_context_comparator
    task_fit: retrieval-context comparator for GLHS narrative evidence; not a governed-state resolver
    read_semantics: frozen v3.1.0 index/query contract (verified only after upstream execution)
    write_semantics: upstream index + context-export ledger required before use
    authorization_semantics: n/a for retrieval context comparator
    concurrency_semantics: n/a for retrieval context comparator
    adapter: evaluation.comparator_studies.official_graphrag.contract
    direct_empirical_comparison_allowed: false
    status: UPSTREAM_EXECUTION_REQUIRED
    direct_comparison_status: ASSET_GATED
    reason: >-
      Real, runnable, license-clear upstream; potentially a DIRECTLY_COMPARABLE
      retrieval comparator only after the source checkout, embedding probes,
      index/context-export ledger, and a frozen same-cohort shared-solver run
      are independently verified. Currently the execution contract has not been
      run, so no numerical comparison is permitted.
    blocker: >-
      Requires a verified source checkout, router-compatible completion and
      embedding probes, upstream index and context-export ledger, and a frozen
      same-cohort shared-solver run.
    fidelity_tests:
      - upstream_source_checkout_verified
      - embedding_probe_router_compatible
      - index_and_context_export_ledger_frozen
      - same_cohort_shared_solver_run_frozen
